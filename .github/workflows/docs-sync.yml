name: Sync project documentation

# Pulls each project's AsciiDoc documentation (data/docs.yml) into content/docs/ and commits it to
# develop, which then builds and deploys the site. Nightly it picks up new commits on the projects'
# main branches and new release tags; it can also be run by hand for one project or one version.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: 'Project key from data/docs.yml (empty: all projects)'
        required: false
      version:
        description: 'Version id (main, latest, a stream id); with ref, syncs exactly that'
        required: false
      ref:
        description: 'Branch or tag to sync the version from'
        required: false
      force:
        description: 'Sync even when nothing changed upstream'
        type: boolean
        default: false

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'smallrye'
    runs-on: ubuntu-latest
    # Diagram blocks ([mermaid], [plantuml], ...) are rendered to SVG by the sync (tools/docs/Docs.java).
    services:
      kroki:
        image: yuzutech/kroki
        env:
          KROKI_MERMAID_HOST: kroki-mermaid
        ports:
          - 8000:8000
      kroki-mermaid:
        image: yuzutech/kroki-mermaid
    env:
      KROKI_URL: http://localhost:8000
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: develop
          # A push made with the app token (not GITHUB_TOKEN) starts the website build.
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
        with:
          version: 0.138.0

      # Releases still documented with MkDocs are converted with pandoc.
      - name: install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: sync
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$VERSION" ] && [ -n "$REF" ]; then
            args=(--project "$PROJECT" --version "$VERSION" --ref "$REF")
          else
            args=(--auto)
            [ -n "$PROJECT" ] && args+=(--project "$PROJECT")
            [ "$FORCE" = true ] && args+=(--force)
          fi
          jbang tools/docs/Docs.java sync "${args[@]}" --summary "$GITHUB_STEP_SUMMARY"

      - name: commit
        run: |
          git add -A content/docs data/docversions.yml
          if git diff --cached --quiet; then
            echo "Documentation unchanged"
            exit 0
          fi
          slug='${{ steps.app-token.outputs.app-slug }}'
          git config user.name "$slug[bot]"
          git config user.email "$(gh api "/users/$slug%5Bbot%5D" --jq .id)+$slug[bot]@users.noreply.github.com"
          git commit -q -m "Sync project documentation"
          git push origin develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
