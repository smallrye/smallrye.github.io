name: SmallRye Website

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'NOTICE'
      - 'README*'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - 'NOTICE'
      - 'README*'
  # Daily, so a post dated later than the merge publishes on its date
  # (future-dated posts are left out until then).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# One deploy at a time: a second run queues behind the first instead of racing its push.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # The sitemap plugin reads each page's last change from git history.
          fetch-depth: 0

      - name: generate website
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          github-pages: 'false'
          site-url: 'https://smallrye.io'

      # A page that carries its own stylesheet can be drawn from the first file the
      # browser receives, without a second request.
      - name: put the stylesheet in the pages
        run: java .github/InlineStyles.java target/roq

      # GitHub Pages cannot redirect: the documentation addresses this site published before
      # (Antora's /docs/<project>/<release>/<page>.html) get small redirect pages.
      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
        with:
          version: 0.138.0

      # An older documentation version stores only the pages that differ from the next newer version:
      # write the others, each in its own version's frame.
      - name: add the documentation pages versions share
        run: jbang tools/docs/Docs.java inherit target/roq

      # Search for the documentation pages: a static index per project, filtered by version.
      - name: index the documentation for search
        run: tools/docs/search-index.sh target/roq

      - name: add redirects for moved documentation
        run: jbang tools/docs/Docs.java redirects target/roq

      # A link to a page that is not in the site fails the build.
      - name: check the links between pages
        run: jbang tools/docs/Docs.java links target/roq

      - name: attach website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: target/roq
          include-hidden-files: true

  deploy:
    needs: [build]
    if: github.event_name != 'pull_request' && github.repository_owner == 'smallrye'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        name: Create GitHub App Token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{steps.app-token.outputs.token}}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>'

      - name: extract website
        uses: actions/download-artifact@v4
        with:
          name: website

      - name: push website
        run: |
          git add -A .
          # The daily run often has nothing new to publish.
          if git diff --cached --quiet; then
            echo "Website unchanged, nothing to deploy"
            exit 0
          fi
          git status --short | head -50
          git commit -m "CI: Build and deploy website updates"
          git push --force
