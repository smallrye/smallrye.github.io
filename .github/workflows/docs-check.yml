name: Check project documentation

# Reusable: a SmallRye project calls this on pull requests that touch its docs. It renders the
# pull request's AsciiDoc with the smallrye.io site exactly as it will be published, fails on a
# missing include or a page that does not render, and attaches the rendered docs as an artifact.
#
#   jobs:
#     docs:
#       uses: smallrye/smallrye.github.io/.github/workflows/docs-check.yml@develop
#       with:
#         project: smallrye-graphql      # the key in smallrye.github.io data/docs.yml

on:
  workflow_call:
    inputs:
      project:
        description: 'Project key in data/docs.yml'
        type: string
        required: true

# It renders pull-request content: read-only, no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Diagram blocks ([mermaid], [plantuml], ...) are rendered to SVG by the sync (tools/docs/Docs.java).
    services:
      kroki:
        image: yuzutech/kroki
        env:
          KROKI_MERMAID_HOST: kroki-mermaid
        ports:
          - 8000:8000
      kroki-mermaid:
        image: yuzutech/kroki-mermaid
    env:
      KROKI_URL: http://localhost:8000
    steps:
      - name: checkout the project
        uses: actions/checkout@v4
        with:
          path: project

      - name: checkout smallrye.io
        uses: actions/checkout@v4
        with:
          repository: smallrye/smallrye.github.io
          ref: develop
          path: site

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: site/pom.xml

      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
        with:
          version: 0.138.0

      - name: copy the docs into the site
        env:
          PROJECT: ${{ inputs.project }}
        run: jbang site/tools/docs/Docs.java sync --strict --project "$PROJECT" --version main --source project

      - name: render the site
        working-directory: site
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: 'true'
        run: |
          ./mvnw -B -q package quarkus:run -DskipTests 2>&1 | tee ../render.log
          # Asciidoctor warnings (such as a section level out of sequence) are reported; a page that
          # fails to render, or an include that cannot be resolved, fails the check.
          grep -E 'WARNING \[asciidoctor\]' ../render.log | sed 's/^.*WARNING \[asciidoctor\] ([^)]*) /::warning::/' || true
          if grep -E 'Roq request failed|Error occurred while rendering|SEVERE \[asciidoctor\]' ../render.log; then
            echo "::error::The documentation does not render cleanly, see the lines above"
            exit 1
          fi

      - name: attach the rendered docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ inputs.project }}
          path: site/target/roq
          retention-days: 7
