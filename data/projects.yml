# The projects on /projects/, a card each. `key` names the project in data/docs.yml: its card links
# to its documentation and shows its logo. `spec` is the specification it implements.

groups:
  - name: Eclipse MicroProfile Platform
    projects:
      - name: SmallRye Config
        key: smallrye-config
        repo: https://github.com/smallrye/smallrye-config
        description: A Java configuration library.
        spec: { name: MicroProfile Config, url: 'https://github.com/eclipse/microprofile-config' }
      - name: SmallRye JWT
        key: smallrye-jwt
        repo: https://github.com/smallrye/smallrye-jwt
        description: Token verification and an API to build and sign tokens.
        spec: { name: MicroProfile JWT RBAC, url: 'https://github.com/eclipse/microprofile-jwt-auth' }
      - name: SmallRye Health
        key: smallrye-health
        repo: https://github.com/smallrye/smallrye-health
        description: Health checks for liveness, readiness and startup.
        spec: { name: MicroProfile Health, url: 'https://github.com/eclipse/microprofile-health' }
      - name: SmallRye Fault Tolerance
        key: smallrye-fault-tolerance
        repo: https://github.com/smallrye/smallrye-fault-tolerance
        description: Bulkheads, circuit breakers, fallbacks, rate limits, retries and timeouts.
        spec: { name: MicroProfile Fault Tolerance, url: 'https://github.com/eclipse/microprofile-fault-tolerance' }
      - name: SmallRye Metrics
        key: smallrye-metrics
        repo: https://github.com/smallrye/smallrye-metrics
        description: Application and runtime metrics.
        spec: { name: MicroProfile Metrics, url: 'https://github.com/eclipse/microprofile-metrics' }
        archived: true
      - name: SmallRye OpenAPI
        repo: https://github.com/smallrye/smallrye-open-api
        description: OpenAPI documents generated from your application's code.
        spec: { name: MicroProfile OpenAPI, url: 'https://github.com/eclipse/microprofile-open-api' }
      - name: SmallRye OpenTracing
        repo: https://github.com/smallrye/smallrye-opentracing
        description: Distributed tracing with OpenTracing.
        spec: { name: MicroProfile OpenTracing, url: 'https://github.com/eclipse/microprofile-opentracing' }
        archived: true
      - name: RESTEasy REST Client
        repo: https://github.com/resteasy/resteasy-microprofile
        description: Type-safe REST clients, part of RESTEasy.
        spec: { name: MicroProfile REST Client, url: 'https://github.com/eclipse/microprofile-rest-client' }

  - name: Eclipse MicroProfile Standalone
    projects:
      - name: SmallRye Context Propagation
        repo: https://github.com/smallrye/smallrye-context-propagation
        description: Carries context, such as the current transaction or request, across threads.
        spec: { name: MicroProfile Context Propagation, url: 'https://github.com/eclipse/microprofile-context-propagation' }
      - name: SmallRye Mutiny
        key: smallrye-mutiny
        repo: https://github.com/smallrye/smallrye-mutiny
        description: An intuitive, event-driven reactive programming library for Java.
        spec: { name: MicroProfile Reactive Streams Operators, url: 'https://github.com/eclipse/microprofile-reactive-streams-operators' }
      - name: SmallRye Reactive Messaging
        key: smallrye-reactive-messaging
        repo: https://github.com/smallrye/smallrye-reactive-messaging
        description: Event-driven, message-based applications on Kafka, AMQP, MQTT, RabbitMQ, Pulsar and more.
        spec: { name: MicroProfile Reactive Messaging, url: 'https://github.com/eclipse/microprofile-reactive-messaging' }
      - name: SmallRye GraphQL
        key: smallrye-graphql
        repo: https://github.com/smallrye/smallrye-graphql
        description: GraphQL services, with type-safe and dynamic Java clients.
        spec: { name: MicroProfile GraphQL, url: 'https://github.com/eclipse/microprofile-graphql' }

  - name: SmallRye Standalone
    projects:
      - name: Jandex
        key: jandex
        repo: https://github.com/smallrye/jandex
        description: A space-efficient Java class file indexer and offline reflection library.
      - name: SmallRye Stork
        key: smallrye-stork
        repo: https://github.com/smallrye/smallrye-stork
        description: Service discovery and client-side load balancing.
      - name: Mutiny Vert.x bindings
        key: smallrye-mutiny-vertx-bindings
        repo: https://github.com/smallrye/smallrye-mutiny-vertx-bindings
        description: Mutiny APIs for Eclipse Vert.x.
      - name: Mutiny Zero
        key: smallrye-mutiny-zero
        repo: https://github.com/smallrye/smallrye-mutiny-zero
        description: A zero-dependency Reactive Streams publishers library.
      - name: SmallRye Common
        repo: https://github.com/smallrye/smallrye-common
        description: Common utilities for SmallRye projects and more.
      - name: SmallRye OpenTelemetry
        repo: https://github.com/smallrye/smallrye-opentelemetry
        description: OpenTelemetry tracing for CDI and Jakarta REST.
        spec: { name: OpenTelemetry, url: 'https://opentelemetry.io' }
      - name: SmallRye AsyncAPI
        repo: https://github.com/smallrye/smallrye-async-api
        description: AsyncAPI documents for MicroProfile applications.
        spec: { name: AsyncAPI, url: 'https://www.asyncapi.com' }
        archived: true
      - name: SmallRye Converters
        repo: https://github.com/smallrye/smallrye-converters
        description: An API to convert a String to other types.
