# The published address. The deploy workflow passes the same value to the Roq action;
# set here too so local builds produce the same canonical links, sitemap and feed.
site.url=https://smallrye.io
quarkus.qute.alt-expr-syntax=true

# Blog posts are AsciiDoc in content/posts/. Jekyll published them at /blog/<file name>/,
# and these keep every existing address working without redirects.
site.collections.posts.layout=post
site.collections.posts.link=/blog/:name/
# Post headers carry Jekyll's dates: 2026-09-16 15:00:00.000 +0100
site.date-format=yyyy-MM-dd[ HH:mm][:ss][.SSS][ Z]
# Jekyll built in UTC on GitHub Actions; show the same dates whatever machine builds the site.
site.time-zone=UTC

quarkus.roq.generator.timeout=180

# Posts and pages are AsciiDoc, rendered by Asciidoctor (the asciidoc-jruby plugin) as on
# the Jekyll site. The layouts print the title, so Asciidoctor must not repeat it: a key
# ending in "!" unsets the attribute (the value is ignored but cannot be empty).
quarkus.asciidoc.attributes."showtitle!"=unset
# Asciidoctor renders in SAFE mode, which keeps includes inside base_dir. The site root (rather
# than each page's directory) lets a docs page in a subdirectory include its version's
# _attributes.adoc and _examples/, while nothing outside the site can be included.
quarkus.asciidoc.base-dir=site
# "@" makes it a default a page can override: blog posts keep Jekyll's ids (_like_this), while
# project docs set Quarkus-style ids (like-this) in their _attributes.adoc.
quarkus.asciidoc.attributes.idseparator=_@

# Project documentation, pulled from each project's repository by tools/docs/sync.py into
# content/docs/<project>/<version>/ and published at /docs/<project>/<version>/<page>/.
site.collections.docs=true
site.collections.docs.layout=doc
site.collections.docs.link=/:raw-path
# Docs are AsciiDoc: their {attribute} references are not Qute expressions.
site.escaped-pages=docs/*/**
# The docs templates walk data/docs.yml and data/docversions.yml, whose list items Qute can
# only type as Object; as on quarkus.io, check those expressions at render time instead.
quarkus.qute.type-check-excludes=java.lang.Object.*
